name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: integrity · tests · wheel
    runs-on: ubuntu-latest
    # contents:write is what `gh release upload` needs; without it the tag run failed with HTTP 403
    # on every release through v1.6.0, so the release assets were uploaded by hand from a local build.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This package carried the live AWS account id in two deploy-time artifacts before it was
      # split out. Both are gitignored now; this makes sure they cannot come back.
      - name: No real AWS account id in committed content
        run: |
          set -eu
          if git grep -I -n -E "arn:aws[a-z-]*:[a-z0-9-]*:[a-z0-9-]*:[0-9]{12}|[0-9]{12}\.dkr\.ecr\." \
             -- . | grep -vE "111122223333|123456789012"; then
            echo "::error::a real AWS account id is present in committed content"
            exit 1
          fi
          echo "account-id scan: clean"

      - name: Core integrity (no drift from the pinned version)
        run: python src/governed_core/verify_core.py

      - name: Install + test
        # The tests import the package from src/ (not an installed copy) so the lock, the flat-import
        # path and the tests all see the same files. This step used to run without PYTHONPATH and
        # failed on every push since 1.3.1 (ModuleNotFoundError: governed_core) — fixed in 1.6.0.
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --quiet "pytest==9.1.1" "ruff==0.15.22" build boto3
          python -m pytest tests -q

      - name: Lint (bug-class checks)
        run: ruff check --select E9,F63,F7,F82 src

      # Build on every run, not just on tags: a wheel that only builds at release time is a wheel
      # that breaks at release time.
      # REPRODUCIBLE: the zip timestamps come from the commit time, so a local build of the same
      # commit yields the same bytes and the same sha256 as CI's (v1.6.0's local vs CI builds differed
      # only by timestamps; the published asset is what the consumers' hash pins verify).
      - name: Build wheel
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --wheel

      - name: Record the artifact hash
        run: |
          set -eu
          cd dist
          sha256sum *.whl | tee RELEASE-HASHES.txt
          echo "Consumers pin this hash with pip --require-hashes; if it changes, installs fail loudly."

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*

      # On a version tag, publish the wheel + its hash so consumers can pin them.
      - name: Attach wheel to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.whl dist/RELEASE-HASHES.txt --clobber
